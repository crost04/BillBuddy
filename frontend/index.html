<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <!-- viewport-fit=cover: use the whole screen, including the area around the notch -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>BillBuddy</title>
  <meta name="theme-color" content="#0f766e">
  <!-- PWA: makes the app installable on the home screen -->
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="BillBuddy">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar">
    <h1 id="title">BillBuddy</h1>
  </header>

  <!-- The views (expenses, form, balances, ...) are rendered in here by js/app.js -->
  <main id="view"></main>

  <nav class="tabbar" id="tabbar">
    <a href="#/expenses" data-tab="expenses"><span class="icon">🧾</span>Ausgaben</a>
    <a href="#/add" data-tab="add" class="add"><span class="icon">＋</span>Neu</a>
    <a href="#/balances" data-tab="balances"><span class="icon">⚖️</span>Salden</a>
    <a href="#/settings" data-tab="settings"><span class="icon">👥</span>Gruppe</a>
  </nav>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
