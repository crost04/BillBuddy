# Backup for keeping the free Render server awake (the main keep-alive is the
# app itself, see billbuddy/api/keep_awake.py). Render puts free services to
# sleep after ~15 minutes without requests; this calls the health endpoint and
# wakes the server up again, e.g. after a restart. GitHub delays scheduled runs
# of small repositories (only 4 runs in the first 24 hours), so this alone was
# not enough. The endpoint does not touch the database, so Neon can still sleep.
name: Keep server awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: # allows starting it by hand in the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Call the health endpoint
        run: curl --fail --silent --show-error --retry 3 --max-time 90 https://billbuddy-fr85.onrender.com/api/health
