# Keeps the free Render server awake, so the app opens without waiting.
# Render puts free services to sleep after ~15 minutes without requests;
# this calls the health endpoint every 10 minutes. The endpoint does not touch
# the database, so the Neon database can still sleep when nobody uses the app.
# Note: GitHub sometimes starts scheduled runs late, so a short sleep can still happen.
name: Keep server awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: # allows starting it by hand in the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Call the health endpoint
        run: curl --fail --silent --show-error --retry 3 --max-time 90 https://billbuddy-fr85.onrender.com/api/health
